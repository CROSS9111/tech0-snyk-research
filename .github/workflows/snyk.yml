name: Snyk (OS deps)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  snyk:
    runs-on: ubuntu-latest

    env:
      # Snyk CLIが参照するトークン（Secretsに入れたもの）
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # EUリージョンの場合は有効化（USなら不要）
      # SNYK_API: https://api.eu.snyk.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 脆弱性があってもCIを赤くしない
      - name: Snyk test (scan open-source deps)
        run: npx snyk@latest test || true

      # mainへのpush時のみダッシュボード登録。失敗してもCIは緑
      - name: Snyk monitor (record on dashboard)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        run: npx snyk@latest monitor --project-name="${{ github.repository }}" || true
